[project]
name = "data-pipeline-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# El paquete se llama pipeline_lab (no data_pipeline_lab), asi que lo indicamos.
module-name = "pipeline_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: pruebas que llaman a la API real de EIA (excluidas por defecto)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: estilo pycodestyle, F: errores (pyflakes), I: orden de imports,
# UP: sintaxis moderna, B: bugs comunes, SIM: simplificaciones
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
