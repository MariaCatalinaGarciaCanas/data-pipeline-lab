[project]
name = "data-pipeline-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1,<0.29",
    "polars>=2.1.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.uv]
# `uv sync` instala tambien dbt (grupo "dbt"). Para omitirlo: `uv sync --no-group dbt`.
default-groups = ["dev", "dbt"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# El paquete se llama pipeline_lab (no data_pipeline_lab), asi que lo indicamos.
module-name = "pipeline_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: evita choques de nombre entre tests de distintas carpetas (p. ej. dos test_client.py)
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: pruebas que llaman a la API real de EIA (excluidas por defecto)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: estilo pycodestyle, F: errores (pyflakes), I: orden de imports,
# UP: sintaxis moderna, B: bugs comunes, SIM: simplificaciones
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
