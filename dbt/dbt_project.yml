name: pipeline_lab_dbt
version: "0.1.0"
config-version: 2

# Perfil definido en profiles.yml (en esta misma carpeta; se usa con `--profiles-dir .`).
profile: pipeline_lab

# Sin telemetria: dbt no envia estadisticas de uso.
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  pipeline_lab_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
